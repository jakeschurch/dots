# Noctalia v5 settings — ported from the v4 settings.json (repo history has
# the original). v5 moved to TOML with a new schema; the v4 file is ignored.

[bar]
order = [ "default" ]

[bar.default]
position = "top"
capsule = true
background_opacity = 0.39
margin_edge = 18
margin_ends = 18
radius = 12
thickness = 40
widget_spacing = 6
font_scale = 1.0
reserve_space = true
show_on_workspace_switch = true
start = [
  "launcher",
  "claude_agents",
  "codex_agents",
  "cpu",
  "temp",
  "ram",
  "network_rx",
  "active_window",
]
center = [ "workspaces", "minimized", "clock", "media" ]
end = [
  "github_prs",
  "github_activity",
  "screen_toolkit",
  "mx",
  "tray",
  "notifications",
  "network",
  "bluetooth",
  "output_volume",
  "input_volume",
  "brightness",
  "battery",
  "control-center",
]

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

[widget.temp]
type = "sysmon"
stat = "cpu_temp"

[widget.ram]
type = "sysmon"
stat = "ram_used"

[widget.network_rx]
type = "sysmon"
stat = "net_rx"

[widget.active_window]
type = "active_window"
max_length = 145.0

[widget.media]
type = "media"
max_length = 500.0

# ── Community-plugin widgets (type = "<author>/<plugin>:<entry>") ──

[widget.claude_agents]
type = "jakeschurch/agents:bar"
provider = "claude"

[widget.codex_agents]
type = "jakeschurch/agents:bar"
provider = "codex"

[widget.minimized]
type = "fr4j4/hyprland-minimize:bar"
mode = "list"
hide_when_empty = true

[widget.github_prs]
type = "raycursive/github-prs:bar"
hide_when_zero = true

[widget.github_activity]
type = "alexmnrs/github-activity:activity"
display_mode = "icon_only"

[widget.screen_toolkit]
type = "alexander/screen-toolkit:widget"

[widget.mx]
type = "gamaraan/mx-control:mx"

[widget.output_volume]
type = "volume"
device = "output"

[widget.input_volume]
type = "volume"
device = "input"

[location]
auto_locate = true

[weather]
enabled = true
effects = true
unit = "imperial"

[nightlight]
enabled = true
force = true
temperature_night = 4000
temperature_day = 6500

[notification]
position = "top_right"
filter_order = [ "wezterm" ]

# WezTerm sends terminal-originated desktop notifications (for example, from
# long-running commands). Keep them entirely out of Noctalia: no toast, sound,
# or notification-history entry.
[notification.filter.wezterm]
enabled = true
match = "wezterm"
show_toast = false
save_history = false
play_sound = false

[dock]
enabled = true
auto_hide = true
position = "bottom"

[shell]
avatar_path = "/home/jake/.face"
time_format = "{:%-I:%M %p}"
date_format = "%A, %x"

[shell.screen_corners]
enabled = true
size = 32

[theme]
source = "builtin"
builtin = "Gruvbox"
mode = "dark"

[brightness]
enable_ddcutil = true

# ── Plugins ───────────────────────────────────────────────────────────────────
# Code comes from the built-in `community` git source; Noctalia clones and
# exports it under ~/.local/state/noctalia/plugins/. Runtime deps live in
# configurations/nixos/apollo/hyprland.nix (+ solaar in the dev python env).

[plugins]
enabled = [
  "jakeschurch/agents",
  "alexmnrs/github-activity",
  "raycursive/github-prs",
  "fr4j4/hyprland-minimize",
  "gamaraan/mx-control",
  "alexander/screen-toolkit",
  "egno/vial_keymap",
]

# Each rule is a GitHub search fragment, prefixed with "is:pr is:open".
# Panel badges show review state (approved / changes requested) + CI per PR.
[plugin_settings."raycursive/github-prs"]
rules = [ "author:@me", "review-requested:@me" ]

[plugin_settings."fr4j4/hyprland-minimize"]
restore_to = "origin"

[plugin_settings."egno/vial_keymap"]
vil_path = "~/keymap.vil"
# xkb_legends.py dlopens "libxkbcommon.so.0" by soname, which isn't on the
# loader path on NixOS — and there's only one OS layout anyway.
alt_layout_enabled = false
