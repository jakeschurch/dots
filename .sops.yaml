creation_rules:
  # Git/nix tokens: the MacBook decrypts these on demand (Forgejo credential
  # helper) since it has no sops-nix. Keep it off the other secrets files.
  - path_regex: secrets/netrc.yaml
    key_groups:
      - age:
          - *admin
          - *apollo_age
          - *artemis_age
          - *macbook_age
  - path_regex: secrets/.*.yaml
    key_groups:
      - age:
          - *admin
          - *apollo_age
          - *artemis_age
